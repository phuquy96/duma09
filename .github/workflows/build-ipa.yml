name: Build Tetoki iOS IPA & LGBT.zip

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Native iOS IPA & Package Zip
    runs-on: macos-14
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Kiem tra va Tu dong Giai nen LGBT.zip
        run: |
          if [ -f "LGBT.zip" ]; then
            echo "📦 Phat hien LGBT.zip, dang giai nen..."
            unzip -q -o LGBT.zip -d . || true
          fi

      - name: 3. Cai dat Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package.json'

      - name: 4. Chuan bi thu muc web www cho Capacitor
        run: |
          mkdir -p www
          cp -rf index.html manifest.json css js assets www/ 2>/dev/null || true

      - name: 5. Cai dat Dependencies
        run: |
          npm install

      - name: 6. Khoi tao & Sync Capacitor iOS Native Project
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: 7. Bien dich Xcode (Native ARM64 Mach-O)
        run: |
          mkdir -p build
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/Tetoki.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      - name: 8. Dong goi file Tetoki.ipa chuan
        run: |
          mkdir -p build/Payload
          cp -R build/Tetoki.xcarchive/Products/Applications/App.app build/Payload/Tetoki.app
          cp -f assets/app_icon_tetoki.png build/Payload/Tetoki.app/AppIcon60x60@2x.png 2>/dev/null || true
          cd build && zip -r -9 Tetoki.ipa Payload && cd ..
          echo "Dong goi IPA hoan tat!"

      - name: 9. Dong goi lai goi LGBT.zip cap nhat
        run: |
          rm -f LGBT.zip
          zip -r -9 LGBT.zip build/Tetoki.ipa index.html manifest.json package.json capacitor.config.json css js assets .github 2>/dev/null || true

      - name: 10. Xuat file Tetoki.ipa (Download tai Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Tetoki.ipa
          path: build/Tetoki.ipa
          retention-days: 30

      - name: 11. Xuat file LGBT.zip (Download tai Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: LGBT.zip
          path: LGBT.zip
          retention-days: 30
